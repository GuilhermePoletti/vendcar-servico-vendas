apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vendcar-servico-vendas
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/GuilhermePoletti/vendcar-servico-vendas.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: vendcar
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
