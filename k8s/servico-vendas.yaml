apiVersion: apps/v1
kind: Deployment
metadata:
  name: servico-vendas
  namespace: vendcar
spec:
  replicas: 2
  selector:
    matchLabels:
      app: servico-vendas
  template:
    metadata:
      labels:
        app: servico-vendas
    spec:
      containers:
        - name: servico-vendas
          image: ghcr.io/guilhermepoletti/vendcar-servico-vendas:11162ae0d0cb7b024807ce048b8a58109a9c296b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vendcar-secrets
                  key: db-password
            - name: DATABASE_URL
              value: postgresql://vendcar:$(DB_PASSWORD)@db-vendas:5432/db_vendas
            - name: CATALOGO_API_URL
              value: http://servico-principal:3000
            - name: PORT
              value: '3001'
          resources:
            requests:
              memory: '128Mi'
              cpu: '100m'
            limits:
              memory: '512Mi'
              cpu: '500m'
          readinessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: servico-vendas
  namespace: vendcar
spec:
  selector:
    app: servico-vendas
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
